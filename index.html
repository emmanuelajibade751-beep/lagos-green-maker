<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Lagos Green Maker | Emmanuel</title>
<style>
:root{color-scheme:light;--paper:#f6f7ef;--white:#fcfdf8;--ink:#24382a;--muted:#4b6152;--line:#cbd4c7;--soft:#edf1e7;--green:#255137}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,"Segoe UI",sans-serif}
a{color:var(--green);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #47865e;outline-offset:3px}
.shell{max-width:1720px;margin:auto;padding:0 32px 40px}
.mast{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.mast nav{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.hero{display:flex;align-items:end;justify-content:space-between;gap:22px;padding:31px 0 23px}
h1,h2,h3,p{margin:0}
h1,h2{font:normal clamp(35px,5vw,64px)/1 Georgia,serif;letter-spacing:-.035em}
.hero p{margin-top:9px;color:var(--muted)}
.search{display:grid;gap:5px;width:min(100%,335px);font-size:13px;font-weight:650}
input,select{min-height:39px;background:var(--white);border:1px solid #95a696;border-radius:5px;padding:7px 10px}
.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
aside{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px}
aside h2{font:650 14px/1.3 Inter,"Segoe UI",sans-serif;letter-spacing:0;margin:0 0 10px}
.types{display:grid;gap:3px}
.type{display:flex;justify-content:space-between;text-align:left;gap:8px;background:none;border:1px solid transparent;border-radius:4px;padding:6px 8px;font-size:13px}
.type:hover,.close:hover{background:var(--soft)}
.type[aria-pressed=true],.tab[aria-selected=true]{background:var(--green);color:white}
.controls{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.sorting{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(131px,1fr));gap:10px}
.card{min-width:0;text-align:left;padding:0;border-radius:6px;overflow:hidden;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column}
.card:hover{border-color:var(--green);box-shadow:0 2px 7px #28453622}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#dddeda}
.caption{display:grid;gap:2px;padding:7px 8px 8px;width:100%}
.caption i{font:italic 15px/1.18 Georgia,serif;overflow-wrap:anywhere}
.caption small,.meta{color:var(--muted);font-size:11px}
.caption .card-property{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:30px 8px;color:var(--muted)}
dialog{width:min(1050px,calc(100% - 24px));max-height:calc(100dvh - 36px);padding:0;border:1px solid #8ea38e;border-radius:10px;color:var(--ink);background:var(--white)}
dialog::backdrop{background:#182b21b8}
.detail-head{padding:19px 24px 13px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:1}
.detail-head h2{font-size:clamp(26px,4vw,41px);margin:5px 46px 5px 0}
.close,.tab{border:1px solid var(--line);border-radius:4px;background:var(--white);padding:6px 10px}
.close{position:absolute;right:19px;top:17px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.detail-body{padding:18px 24px 24px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.stage img{display:block;width:100%;height:auto;background:var(--soft)}
.stage-info{padding:10px}
.stage-info h3{font-size:14px}
.stage-info p,.stage-info details{font-size:12px;margin-top:6px;overflow-wrap:anywhere}
h3{font-size:17px;margin-bottom:6px}
.detail-body>p,.detail-body>section{margin-bottom:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px;margin:12px 0}
.facts div{background:var(--soft);padding:7px 9px;border-radius:4px}
dt{font-size:12px;color:var(--muted)}
dd{margin:2px 0 0}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:600}
ul{padding-left:20px;margin:7px 0}
.components{columns:2}
.components li{break-inside:avoid;margin:0 0 5px}
.note{color:var(--muted);font-size:13px}
.property{margin-top:8px;border-bottom:1px solid var(--line);padding:0 0 9px}
@media(max-width:850px){.shell{padding-inline:16px}.workspace{grid-template-columns:167px minmax(0,1fr);gap:12px}}
@media(max-width:600px){.hero,.mast{align-items:start;flex-direction:column}.workspace{display:block}aside{margin-bottom:10px}.types{display:flex;flex-wrap:wrap}.type{border-color:var(--line);gap:5px}.grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}.stages{grid-template-columns:1fr}.components{columns:1}.detail-head,.detail-body{padding-inline:13px}}
/* Plant details keep comparison images prominent and supporting data close. */
dialog{width:min(1220px,calc(100% - 24px))}
.tabs{gap:0;border-bottom:1px solid var(--line);margin-top:20px}
.tab{flex:1;border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 8px;background:transparent;color:var(--muted)}
.tab[aria-selected=true]{background:transparent;color:var(--ink);border-bottom-color:var(--green);font-weight:650}
.detail-section{margin-top:22px;padding:14px 0}
.detail-section>summary{font-size:16px;margin-bottom:12px}
.detail-head .meta{font-size:12px}
.type-filter{padding:0;border:0}
.type-filter>summary{display:none}
.balcony-study{margin:0 0 26px}
.balcony-study img{width:100%;height:auto;display:block;background:var(--soft)}
.balcony-study figure{margin:12px 0}
.balcony-study figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.balcony-links{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.layout-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.layout-options button{border:1px solid var(--line);background:var(--white);padding:8px 14px;border-radius:4px}
.layout-options button[aria-pressed=true]{background:var(--green);color:white}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.caption{padding:10px}.caption i{font-size:17px}}
@media(max-width:600px){.type-filter>summary{display:block}.type-filter .types{margin-top:10px}.detail-head h2{font-size:29px}.tabs{margin-top:14px}.tab{padding:10px 6px}.mast nav{gap:12px}}

.tower-intro{max-width:800px;margin-bottom:16px}
.tower-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}
.tower-toolbar>label{display:grid;gap:5px;min-width:0;max-width:100%}
.tower-toolbar select{max-width:100%;width:320px}
.tower-views{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tower-views button{padding:8px 12px;background:var(--white);border:1px solid var(--line);border-radius:4px}
.tower-views button[aria-pressed=true]{background:var(--green);color:white}
.tower-views label{display:flex;align-items:center;gap:5px}
.tower-views input{min-height:unset}
.tower-canvas{height:540px;max-height:65vh;width:100%;background:#eef0e7;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.tower-canvas canvas{display:block;width:100%;height:100%;touch-action:none}
.tower-loading{padding:24px;color:var(--muted)}
.tower-fit{font-size:13px;border-left:3px solid #a18b50;padding:10px 14px;background:#f5f1e3;margin:12px 0}
#tower-source{overflow-wrap:anywhere;margin-top:8px}
@media(max-width:600px){.tower-canvas{height:430px}.tower-toolbar select{width:100%}.tab{font-size:13px}}

.tower-render-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tower-render-pair figure{margin:8px 0}.tower-render-pair img{width:100%;height:auto;display:block}
.tower-render-pair figcaption{font-size:13px;margin:6px 0}.tower-render-study{margin-bottom:24px}
.tower-baseline>summary{font-size:17px;margin-bottom:16px}
.tower-solar button{padding:6px 10px;border:1px solid var(--line);background:var(--white);border-radius:4px}
@media(max-width:600px){.tower-render-pair{grid-template-columns:1fr}}
.plant-solar-panel{margin:20px 0;padding:14px 0}.plant-solar-panel>summary{font-size:17px}.plant-solar-panel .plant-solar{border-top:0!important;margin-top:0!important}</style>

n":"2026-11-05"},{"id":"G021","title":"Breadfruit horticulture","url":"https://ntbg.org/breadfruit/care/horticulture/","publisher":"National Tropical Botanical Garden, Breadfruit Institute","authors":"National Tropical Botanical Garden, Breadfruit Institute","year":"undated","type":"Institutional botanical or cultivation reference","access":"Relevant source sections opened and read","locator":"Propagation; roots; soil; planting; pests and diseases","scope":"Pacific crop cultivation; cultivar and propagation method affect size and establishment.","checked_on":"2026-11-05"}],"mature":[15.0,20.0],"spread":[10.0,18.0],"size_basis":"Agroforestree height. NParks maximum height is 40 m.","dimension":"height","dimensions":{"width_mm":6000,"length_mm":4000,"soil_mm":800,"service_mm":0,"freeboard_mm":50,"water_mm":0},"bounds":[6.0,4.0,0.9],"components":["Continuous rooting zone | modelled portion.047","Pavement deck / section context.033","Supported soil frame / post study.099","Supported soil frame / post study.100","Supported soil frame / post study.101"],"route":"ground-connected tree rooting system","gaps":"Target crown; rootable soil; soil water capacity; irrigation; anchorage; utilities; mature clearance; Identify breadfruit cultivar and mature fruiting target.","rootball":"NOT PROVIDED","pdf_page":104,"review":"See CURRENT_ACCEPTANCE_LEDGER.md for the current species-specific disposition.","container_sheet":"container_sheets/LAG-027.webp"}];
const byId = new Map(plants.map(plant => [plant.id, plant]));
const groups = [...new Set(plants.map(plant => plant.category))].sort();
const byName = (a, b) => a.name.localeCompare(b.name);
const search = document.querySelector('#search');
const sort = document.querySelector('#sort');
const types = document.querySelector('#types');
const grid = document.querySelector('#grid');
const dialog = document.querySelector('#plant');
const detail = document.querySelector('#detail');
const tabs = [...document.querySelectorAll('.tab')];
let selectedType = 'All plants';
let selectedPlant;
let lastCard;

const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>
  ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
const url = value => /^https?:\/\//i.test(value || '') ? escape(value) : '';
const metres = value => Number(value).toFixed(3) + ' m';
const width = stage => Math.max(stage.x, stage.y);
const band = values => values.join('–') + ' m';
const hasTiming = plant => plant.stages.some(stage => stage.timing.length);
function textOrder(property) {
  return (a, b) => {
    const first = a.properties[property] || '';
    const second = b.properties[property] || '';
    return Number(!first) - Number(!second) || first.localeCompare(second) || byName(a, b);
  };
}
const comparators = {
  name: byName,
  height: (a, b) => a.stages[1].top - b.stages[1].top || byName(a,b),
  spread: (a, b) => width(b.stages[1]) - width(a.stages[1]) || byName(a,b),
  soil: (a, b) => b.dimensions.soil_mm - a.dimensions.soil_mm || byName(a,b),
  water: textOrder('Water'),
  light: textOrder('Light'),
  system: (a, b) => a.system.localeCompare(b.system) || byName(a,b),
  timing: (a, b) => Number(hasTiming(b)) - Number(hasTiming(a)) || byName(a,b),
};

function drawGrid() {
  const terms = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const matching = plants.filter(plant => {
    const haystack = [plant.name, plant.identity.common_name, plant.identity.accepted_name,
      plant.identity.family, plant.id, plant.category, plant.system].join(' ').toLowerCase();
    return terms.every(term => haystack.includes(term));
  });
  for (const button of types.children) {
    const group = button.dataset.type;
    button.setAttribute('aria-pressed', String(selectedType === group));
    button.lastElementChild.textContent = group === 'All plants' ? matching.length :
      matching.filter(plant => plant.category === group).length;
  }
  const visible = matching.filter(plant => selectedType === 'All plants' || plant.category === selectedType);
  visible.sort(comparators[sort.value] || byName);
  grid.innerHTML = visible.map((plant, index) => {
    const stage = plant.stages[1];
    const labels = {
      height: metres(stage.top) + ' top Z',
      spread: metres(width(stage)) + ' crown',
      soil: plant.dimensions.soil_mm + ' mm ' + (plant.kind === 'mount' ? 'pad' : 'medium'),
      water: plant.properties.Water || 'Water guidance unavailable',
      light: plant.properties.Light || 'Light guidance unavailable',
      system: plant.system + ' · ' + plant.kind,
      timing: hasTiming(plant) ? 'Conditional timing evidence' : 'Age gap',
    };
    const label = labels[sort.value] || plant.identity.common_name || plant.category;
    return '<button type="button" class="card" data-id="' + plant.id + '" aria-haspopup="dialog">' +
      '<img src="' + escape(plant.thumbnail) + '" width="300" height="300" alt="" ' +
      (index >= 24 ? 'loading="lazy"' : '') + '><span class="caption"><i>' + escape(plant.name) +
      '</i><small class="card-property" title="' + escape(label) + '">' + escape(label) +
      '</small><small>' + plant.id + '</small></span></button>';
  }).join('');
  document.querySelector('#count').textContent = visible.length + ' of ' + plants.length + ' plants';
  document.querySelector('#empty').hidden = visible.length > 0;
}
function showStages(plant) {
  return '<p class="note">Three study stages at the same camera scale. Dimensions come from the saved models. Conditional source times refer to the study conditions shown.</p><div class="stages">' +
    plant.stages.map(stage =>
      '<article class="stage"><a href="' + escape(stage.image) + '" target="_blank" rel="noopener">' +
      '<img src="' + escape(stage.image) + '" width="900" height="900" alt="' +
      escape(plant.name + ', ' + stage.name) + '"></a><div class="stage-info"><h3>' +
      escape(stage.id + ' · ' + stage.name) + '</h3><p>Top / minimum Z ' + metres(stage.top) +
      ' / ' + metres(stage.bottom) + '<br>Datum: ' + escape(stage.datum) +
      '<br>Crown X × Y ' + metres(stage.x) + ' × ' + metres(stage.y) + '</p>' +
      (stage.reach ? '<p>Radial reach from attachment ' + metres(stage.reach) + '</p>' : '') +
      (stage.presentation ? '<p>' + escape(stage.presentation) + '</p>' : '') +
      renderTiming(stage, plant) + '<details><summary>Blender scene reference</summary><p>' + escape(stage.file) + '<br>' + escape(stage.scene) + '</p><p>' +
      escape(stage.anatomy) + '</p></details></div></article>'
    ).join('') + '</div>';
}
function facts(items) {
  return '<dl class="facts">' + items.map(([label, value]) =>
    '<div><dt>' + escape(label) + '</dt><dd>' + escape(value) + '</dd></div>').join('') + '</dl>';
}
function showContainer(plant) {
  const d = plant.dimensions;
  const document = escape(plant.container_sheet);
  return '<h3>' + escape(plant.system + ' · ' + plant.kind) + '</h3><p>' + escape(plant.route) +
    '. ' + escape(plant.phase) + '.</p><p class="note">Stage 02 shows the detailed assembly. Stages 01 and 03 use planting context sections. Medium and service dimensions are study provisions.</p>' +
    facts([
      ['Measured exterior X × Y × Z', plant.bounds.map(metres).join(' × ')],
      ['Proposed width × length', d.width_mm + ' × ' + d.length_mm + ' mm'],
      [plant.kind === 'mount' ? 'Proposed attachment pad' : 'Proposed medium depth', d.soil_mm + ' mm'],
      ['Proposed service allowance', d.service_mm + ' mm'],
      ['Proposed freeboard', d.freeboard_mm + ' mm'],
      ['Proposed water depth', d.water_mm + ' mm'],
    ]) +
    '<p><a href="' + document + '" target="_blank" rel="noopener">Open illustrated container sheet, page ' +
    plant.pdf_page + '</a></p>' +
    '<details><summary>Modelled components (' + plant.components.length + ')</summary><ul class="components">' +
    plant.components.map(name => '<li>' + escape(name) + '</li>').join('') +
    '</ul></details><details><summary>Rootball and fit evidence</summary><p>Measured rootball: ' +
    escape(plant.rootball) + '. ' + escape(plant.gaps) + '</p></details>';
}
function showEvidence(plant) {
  const sources = new Map(plant.sources.map(source => [source.id, source]));
  return '<section><h3>Size scenario</h3><p>' + escape(band(plant.mature) + ' ' + plant.dimension +
    ' · ' + band(plant.spread) + ' spread. ' + plant.size_basis) + '</p></section>' +
    '<section><h3>Identity and Lagos records</h3><p>' + escape(plant.identity.accepted_name) +
    ' · ' + escape(plant.identity.family) + '</p><p>' + escape(plant.identity.origin_status) +
    '</p><p>' + escape(plant.lagos.summary) + ' ' +
    (plant.lagos.source_urls || []).filter(url).map((link, index) =>
      '<a href="' + url(link) + '">Occurrence ' + (index + 1) + '</a>').join(' · ') + '</p></section>' +
    '<section><h3>Plant properties</h3>' +
    plant.claims.map(claim => {
      const links = (claim.source_ids || []).map(id => sources.get(id)).filter(source => source && url(source.url));
      return '<div class="property"><strong>' + escape(claim.topic) + '</strong><p>' + escape(claim.statement) +
        '</p><p class="note">' + escape(claim.conditions) + ' ' + links.map(source =>
          '<a href="' + url(source.url) + '" title="' + escape(source.title) + '">' + escape(source.id) + '</a>'
        ).join(' · ') + '</p></div>';
    }).join('') + '</section><details><summary>Source register</summary><ul>' +
    plant.sources.map(source => '<li>' + (url(source.url) ? '<a href="' + url(source.url) + '">' +
      escape(source.title) + '</a>' : escape(source.title)) + ' · ' + escape(source.scope) + '</li>').join('') +
    '</ul></details>';
}
function showPlant(plant) {
  return showStages(plant) + '<details class="detail-section"><summary>Original container and components</summary>' +
    showContainer(plant) + '</details>';
}
function showResearch(plant) {
  return '<details class="detail-section" open><summary>Growth timing</summary>' + showGrowthTiming(plant) +
    '</details><details class="detail-section"><summary>Properties, identity and sources</summary>' +
    showEvidence(plant) + '</details>';
}
const panels = {stages:showPlant, balcony:showBalconyStudies, tower:showTowerPreview, growing:showGrowingRequirements, evidence:showResearch};

function selectTab(name) {
  for (const tab of tabs) {
    const selected = tab.dataset.tab === name;
    tab.setAttribute('aria-selected', String(selected));
    tab.tabIndex = selected ? 0 : -1;
    if (selected) detail.setAttribute('aria-labelledby', tab.id);
  }
  window.disposeTowerPreview?.();
  detail.innerHTML = panels[name](selectedPlant);
  if (name === "tower") window.mountTowerPreview(selectedPlant);
  dialog.scrollTop = 0;
  history.replaceState(null, '', '#' + selectedPlant.id + (name === 'stages' ? '' : '/' + name));
}
function openPlant(id, view = 'stages') {
  const plant = byId.get(id);
  if (!plant) return;
  selectedPlant = plant;
  document.querySelector('#plant-name').textContent = plant.name;
  document.querySelector('#plant-meta').textContent = [id, plant.category, plant.system].join(' · ');
  document.querySelector('#common').textContent = plant.identity.common_name || '';
  selectTab(Object.hasOwn(panels, view) ? view : 'stages');
  if (!dialog.open) dialog.showModal();
  document.querySelector('#close').focus();
}

for (const label of ['All plants', ...groups]) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'type';
  button.dataset.type = label;
  button.append(label, document.createElement('span'));
  button.addEventListener('click', () => {
    selectedType = label;
    drawGrid();
  });
  types.append(button);
}
search.addEventListener('input', drawGrid);
sort.addEventListener('change', drawGrid);
grid.addEventListener('click', event => {
  const card = event.target.closest('.card');
  if (!card) return;
  lastCard = card;
  history.replaceState(null, '', '#' + card.dataset.id);
  openPlant(card.dataset.id);
});
for (const tab of tabs) {
  tab.addEventListener('click', () => selectTab(tab.dataset.tab));
  tab.addEventListener('keydown', event => {
    const index = tabs.indexOf(tab);
    const next = {ArrowLeft:(index + tabs.length - 1) % tabs.length,
      ArrowRight:(index + 1) % tabs.length, Home:0, End:tabs.length - 1}[event.key];
    if (next === undefined) return;
    event.preventDefault();
    selectTab(tabs[next].dataset.tab);
    tabs[next].focus();
  });
}
document.querySelector('#close').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  window.disposeTowerPreview?.();
  history.replaceState(null, '', location.href.split('#')[0]);
  if (lastCard?.isConnected) lastCard.focus();
  else search.focus();
});
drawGrid();
function openFromLocation() {
  const [id, view] = location.hash.slice(1).split('/');
  openPlant(id, view || 'stages');
}
window.addEventListener('hashchange', openFromLocation);
detail.addEventListener('click', event => {
  const button = event.target.closest('[data-layout]');
  if (!button) return;
  const buttons = [...detail.querySelectorAll('[data-layout]')];
  const selected = button.getAttribute('aria-pressed') === 'true';
  if (selected && buttons.filter(item => item.getAttribute('aria-pressed') === 'true').length === 1) return;
  button.setAttribute('aria-pressed', String(!selected));
  detail.querySelector('[data-layout-panel="' + button.dataset.layout + '"]').hidden = selected;
});
openFromLocation();
</script>
</body>
</html>
